<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aydınlatma Metni</title>
<style>
:root{--bg:#f5f1ea;--card:#fff;--tx:#1d2b33;--mu:#5d6b73;--co:#0d5c73}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--card:#18262d;--tx:#e8eef1;--mu:#9bb0ba}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.65}
.w{max-width:780px;margin:0 auto;padding:16px}.c{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:20px 0 4px}p{margin:6px 0}.mu{color:var(--mu);font-size:13px}
.kh{display:flex;align-items:center;gap:12px;background:var(--co);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:14px}.kh b{font-size:18px}.kc{flex:none;width:48px;height:48px;border-radius:12px;background:#fff;display:grid;place-items:center;padding:5px}.kc img{max-width:100%;max-height:100%;object-fit:contain}
</style></head><body><div class="w" id="r"><p class="mu">Yükleniyor…</p></div><script src="/aydinlatma.js"></script></body></html>
