<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sponsor Kartı</title>
<style>
:root{--bg:#f5f1ea;--card:#fff;--tx:#1d2b33;--mu:#5d6b73;--co:#0d5c73;--or:#f07a2a;--line:#e6e0d4}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--card:#18262d;--tx:#e8eef1;--mu:#9bb0ba;--line:#2a3a43}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5}
.w{max-width:720px;margin:0 auto;padding:16px}.c{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
h1{margin:0 0 2px;font-size:26px}.mu{color:var(--mu);font-size:14px}.tag{display:inline-block;background:var(--line);border-radius:99px;padding:2px 10px;font-size:13px;margin-right:6px}
.hero{display:flex;gap:16px;flex-wrap:wrap}.hero img{width:170px;height:210px;object-fit:cover;border-radius:14px}.ph{width:170px;height:210px;border-radius:14px;background:var(--line)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}.g b{display:block}.bar{background:var(--line);border-radius:99px;height:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--co)}
.m{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.m img,.m video{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#000}
.n{border-top:1px solid var(--line);padding:8px 0}.kh{display:flex;align-items:center;gap:12px;background:var(--co);color:#fff;border-radius:16px;padding:12px 16px;margin-bottom:14px}.kh b{font-size:18px;line-height:1.2}.kc{flex:none;width:52px;height:52px;border-radius:12px;background:#fff;display:grid;place-items:center;padding:5px}.kc img{max-width:100%;max-height:100%;object-fit:contain}
button{background:var(--co);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:15px;cursor:pointer}
.cert{border:6px double var(--co);text-align:center;padding:36px 20px;background:var(--card)}.cert h1{font-size:32px;color:var(--co)}.cert p{font-size:18px}
@media print{body{background:#fff;color:#000}.np{display:none}.c{box-shadow:none}}
</style></head><body><div class="w" id="r"><p class="mu">Yükleniyor…</p></div><script src="/sponsor.js"></script></body></html>
